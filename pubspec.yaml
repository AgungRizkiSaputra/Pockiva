name: tabungan_pribadi
description: "Aplikasi Mobile Tabungan Pribadi — manajemen tabungan dan pengeluaran harian dengan input di bawah 5 detik."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.8.4
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  connectivity_plus: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  patrol: ^3.15.0

flutter:
  uses-material-design: true
