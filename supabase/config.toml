project_id = "tabungan-pribadi"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "com.tabunganpribadi.app://login-callback/"
additional_redirect_urls = [
  "http://localhost:3000",
  "com.tabunganpribadi.app://login-callback/"
]
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.rate_limit]
sign_in_sign_ups = 20
token_refresh = 60
token_verifications = 15

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_WEB_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[functions.pin-manage]
verify_jwt = true

[functions.pin-verify]
verify_jwt = true

[functions.transactions-api]
verify_jwt = true

[functions.smart-reminder]
verify_jwt = false
